[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gensim"
version = "0.1.0"
description = "GenSim simulation and oracle demonstration collection"
requires-python = ">=3.10,<3.11"
dependencies = [
    "setuptools==80.9.0",
    "gym==0.26.2",
    "numpy==1.26.4",
    "pybullet==3.2.7",
    "matplotlib==3.8.4",
    "opencv-python==4.10.0.84",
    "meshcat==0.3.2",
    "scipy==1.11.4",
    "scikit-image==0.22.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "hydra-core==1.3.2",
    "ftfy>=6,<7",
    "transforms3d==0.4.2",
    "kornia==0.7.2",
    "pytorch-lightning==2.1.4",
    "torchmetrics==1.3.2",
    "transformers==4.36.2",
    "timm==0.6.13",
    "pillow==9.5.0",
    "ipython>=8,<9",
    "pygments>=2,<3",
    "imageio>=2,<3",
    "trimesh>=4,<5",
    "rtree>=1,<2",
    "mujoco>=3.2,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
llm = ["openai>=2,<4", "python-dotenv>=1,<2", "seaborn>=0.13,<0.14"]

[tool.uv]
package = true

# Include stdio before PyBullet's bundled zlib defines fdopen on macOS.
# Keep camera arrays enabled in the isolated PyBullet build environment.
[tool.uv.extra-build-variables]
pybullet = { CFLAGS = "-include stdio.h", CXXFLAGS = "-include stdio.h" }

[tool.uv.extra-build-dependencies]
pybullet = ["numpy==1.26.4"]
